name: Compiles only

on:
  push:
    branches:
      - main
      - maintenance/0.30.1
      - prepare/ws0048-formal031
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn --version

      - name: Install deps
        run: |
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain

      - name: Prepare reviewed migration with the formal CLI
        run: |
          set -euo pipefail
          calcit -v
          calcit fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          yarn check:unit
          node acceptance/prepare-ws.mjs

      - name: "validate snapshots"
        run: |
          set -euo pipefail
          calcit calcit.cirru edit format
          test "$(git hash-object calcit.cirru)" = "$(cat acceptance/snapshot-blob.txt)"
          calcit calcit.cirru --check-only
          calcit calcit.cirru --entry server --check-only
          calcit calcit.cirru fix --workflow strict --verify --format json | jq -e '.data.workflow.status == "passed" and .diagnostics == []'
          calcit calcit.cirru --check-only --ns ws-edn.client --ns ws-edn.schema --ns ws-edn.util --ns ws-edn.app.page --format edn
          calcit calcit.cirru --entry server --check-only --ns ws-edn.server --ns ws-edn.schema --ns ws-edn.util --ns ws-edn.app.server --format edn
          calcit calcit.cirru analyze weak-types --only dynamic-method --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru --entry server analyze weak-types --only dynamic-method --format json | jq -e '.data.summary.findings == 0'

      - name: "run tests and deprecated API check"
        run: |
          yarn check:unit
          yarn check:deprecated
          calcit calcit.cirru docs check-md README.md --dep ./ --failures-only

      - name: "compile to js"
        run: |
          yarn compile-page
          yarn compile-server
          node --test scripts/node-host-methods.test.mjs
          node --test scripts/client-server-roundtrip.test.mjs
          yarn check:client-generation
          yarn vite build --base=./

      - name: Preserve prepared source and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ws-prepared
          path: |
            calcit.cirru
            acceptance/
          if-no-files-found: error
          retention-days: 7
